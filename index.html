function act(a,v){
const p=P(),k=dk(D);
if(scr=='cine'&&$('#ct')){cd.t=$('#ct').value;cd.r=$('#cr').value}
if(a=='pet'){const e=$('.pet')||$('.sw2');if(e){e.classList.remove('bn');void e.offsetWidth;e.classList.add('bn')}S.taps=(S.taps||0)+1;chk();save();return}
if(a=='ok')PU=null;
else if(a=='menu')menu=1;
else if(a=='close')menu=0;
else if(a=='d')D.setDate(D.getDate()+ +v);
else if(a=='tab')tab=v;
else if(a=='chk'){const d=p.done[k]=p.done[k]||{};const n=((d[v]||0)+1)%3;n?d[v]=n:delete d[v];if(n==1)p.act=Date.now()}
else if(a=='sel'){const l=p.plan[k]=p.plan[k]||[];const i=l.indexOf(v);i<0?l.push(v):l.splice(i,1)}

else if(a=='ldl'){if(confirm('¿Quitar de la lista?'))p[lk()].splice(+v,1)}
else if(a=='gs'){const R=gy(p).rs.find(x=>x.id==v);if(!R||!R.ex.length){alert('Añade ejercicios a la rutina primero.');return}W={rid:v,ei:0,si:0,ph:'w',st:Date.now(),t:0,end:0};p.tm=(p.tm||0)+1;if(R.ex[0].d)setT(R.ex[0].d)}

else if(a=='gend'){if(confirm('¿Cancelar?'))W=null}
else if(a=='gq'){W={q:1};setT(+v);p.tm=(p.tm||0)+1}

else if(a=='grn'){const R=gy(p).rs.find(x=>x.id==ge),n=(prompt('Nombre de la rutina',R.n)||'').trim();if(n){R.n=n;if(/saitama|one punch/i.test(n))p.ee=1}}
else if(a=='gxd')gy(p).rs.find(x=>x.id==ge).ex.splice(+v,1);
else if(a=='gadd'){const n=(prompt('Nombre del ejercicio')||'').trim();if(n){const se=parseInt(prompt('Series','3'))||3,rr=(prompt('Repeticiones, o segundos si termina en s (ej. 40s)','12')||'12').trim(),d=/s$/i.test(rr)?parseInt(rr)||30:0,pr=parseInt(prompt('Descanso en segundos','60'))||60;gy(p).rs.find(x=>x.id==ge).ex.push({n,s:se,r:d?0:parseInt(rr)||12,d,p:pr})}}
else if(a=='sc'){scr=v;menu=0;if(v!='saru'){clearInterval(gtm);gtm=0;gmode=''}}
else if(a=='food'){const o=FD[+v],f0=fv(p);if(f0>=96){smsg='No puedo más… ¡estoy lleno!';gm('full',2400)}else{const fav=hs(S.cur+'fav')%FD.length==+v;p.hg=Math.min(100,f0+o[2]+(fav?10:0));p.ht=Date.now();p.fd=(p.fd||0)+1;fdE=o[0];smsg=fav?'¡'+o[1]+'! ¡Es mi favorita!':'Ñam ñam… '+o[1]+' riquísimo';gm('eat',2000,fav?'love':'')}}
else if(a=='gst'){if(v!='sleep')p.pl=(p.pl||0)+1;smsg=GM[v];gm(v,v=='sleep'?4200:2800)}
else if(a=='rnd'){const z=p.sr=p.sr||{fur:0,bd:1,eq:{}};SL.forEach(([k])=>{const o=PC.map((c,i)=>[c,i]).filter(([c])=>c.s==k&&(c.a===null||p.ach[c.a]));z.eq[k]=o[Math.random()*o.length|0][1]});p.wc=(p.wc||0)+1}
else if(a=='mg'){clearInterval(gtm);gtm=0;gmode=v;G2={};if(v=='ban'){G2={n:0,t:20,c:-1,b:0};gtm=setInterval(btick,650)}else if(v=='mem'){const e=['🍌','🍎','🍙','🍜','🍡','🥭'];G2={c:[...e,...e].sort(()=>Math.random()-.5),f:[],m:{},mv:0,lock:0}}}

else if(a=='rp'){const o=['✊','✋','✌️'],me=+v,sa=Math.random()*3|0,w=(me-sa+3)%3;G2={me:o[me],sa:o[sa],r:w};p.mgp=(p.mgp||0)+1;if(w==1){p.rw=(p.rw||0)+1;p.rc=(p.rc||0)+1;p.rbs=Math.max(p.rbs||0,p.rc);mgx(p,3);smsg='¡Has ganado! Saru protesta…';gm('sad',2200)}else if(w==2){p.rc=0;smsg='¡He ganado yo! 🐒';gm('happy',2200)}else{smsg='¡Empate!';gm('flex',1800)}}
else if(a=='mc'){const G=G2,i=+v;if(G.lock||G.m[i]||G.f.includes(i))return;G.f.push(i);if(G.f.length==2){G.mv++;const[x,y]=G.f;if(G.c[x]==G.c[y]){G.m[x]=G.m[y]=1;G.f=[];if(Object.keys(G.m).length==12){p.mgp=(p.mgp||0)+1;p.mbm=Math.min(p.mbm||99,G.mv);mgx(p,Math.max(3,15-G.mv))}}else{G.lock=1;setTimeout(()=>{G.f=[];G.lock=0;r()},900)}}}
else if(a=='chst'){if(p.ck!=td()){const x=5+Math.floor(Math.random()*21);p.cxp=(p.cxp||0)+x;p.cn=(p.cn||0)+1;p.ck=td();p.cr='+'+x+' XP · '+QT[hs(td()+S.cur)%QT.length];toast('🎁','¡Cofre abierto!','+'+x+' XP')}}
else if(a=='wtr'){const w=p.wt=p.wt||{},n=w[k]||0;w[k]=n==+v?+v-1:+v;if(w[k]==8&&n<8)toast('💧','¡Meta de agua!','+10 XP')}
else if(a=='mod'){const m=p.mo=p.mo||{};if(m[k]==+v)delete m[k];else m[k]=+v}
else if(a=='gf'){scr='gym';W={q:1,f:1};setT(1500);p.tm=(p.tm||0)+1}
else if(a=='tps'){const n=(prompt('Nombre de la plantilla (ej. Día de gym)')||'').trim();if(n&&(p.plan[k]||[]).length)(p.tpl=p.tpl||{})[n]=[...p.plan[k]]}
else if(a=='tpa'){p.plan[k]=((p.tpl||{})[v]||[]).filter(i=>p.tasks.some(t=>t.id==i))}
else if(a=='tpd'){if(confirm('¿Borrar la plantilla?'))delete p.tpl[v]}
else if(a=='bke'){S.bu=1;const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));if(navigator.clipboard)navigator.clipboard.writeText(c).then(()=>alert('Copia de seguridad copiada. Guárdala en un sitio seguro.'),()=>prompt('Copia tu copia de seguridad',c));else prompt('Copia tu copia de seguridad',c)}
else if(a=='bki'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bkt').value.trim()))));if(!o.p)throw 0;if(confirm('Se reemplazarán todos tus datos actuales. ¿Continuar?')){localStorage.setItem(K,JSON.stringify(o));location.reload();return}}catch(e){alert('Esa copia no es válida.')}}
else if(a=='rul'){const L=p[cv]||[],c=L.map((x,i)=>i).filter(i=>L[i].st=='p');if(!c.length)toast('🎲','Sin opciones','Añade algo a «Por ver»');else{rlr={cv,i:c[Math.random()*c.length|0]};p.rl=(p.rl||0)+1}}

else if(a=='clr'){(p.sr=p.sr||{fur:0,bd:1,eq:{}}).eq={}}

else if(a=='bd'){(p.sr=p.sr||{fur:0,bd:1,eq:{}}).bd=+v}
else if(a=='wt')wt=v;
else if(a=='eqp'){const c=PC[v],z=p.sr=p.sr||{fur:0,bd:1,eq:{}};if(c.a!==null&&!p.ach[c.a]){toast('🔒',c.n,'Se consigue con: '+AD[c.a].n+' ('+AD[c.a].d+')');return}if(z.eq[c.s]==v)delete z.eq[c.s];else z.eq[c.s]=+v;p.wc=(p.wc||0)+1}
else if(a=='nv')nv=v;

else if(a=='ds')p.shop.splice(+v,1);
else if(a=='cs')p.shop=p.shop.filter(x=>!x.d);
else if(a=='m1')menu=1;

else if(a=='psv'){const n=($('#pn2').value||'').trim();p.bio=$('#bio').value.trim();if(n&&n!=S.cur&&!S.p[n]){S.p[n]=S.p[S.cur];delete S.p[S.cur];S.cur=n}menu=1}
else if(a=='card'){const s=fs(p),c=`${S.cur} · ${S.rk[s.rk]} · Nivel ${s.l} · 🔥 ${s.cur} · 🏆 ${s.ac}/${AD.length} logros`;navigator.clipboard?navigator.clipboard.writeText(c).then(()=>alert('Tarjeta copiada')):prompt('Copia tu tarjeta',c)}

else if(a=='imp'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));let n=o.n,i=2;while(S.p[n])n=o.n+' '+i++;const q=mk();q.tasks=o.t.map((x,j)=>({id:'i'+j,t:String(x[1]),c:String(x[0])}));S.p[n]=q;S.cur=n;S.ex=1;alert('Perfil importado: '+n)}catch(e){alert('Ese código no es válido.')}}
else if(a=='rst'){if(confirm('¿Borrar todos tus datos?')){try{localStorage.removeItem(K)}catch(e){}location.reload();return}}
const q=P();dec(q);const s=chk();
if(s.l>q.lv)toast('⬆️','¡Nivel '+s.l+'!','Ahora eres '+S.rk[s.rk]);
q.lv=s.l;
if(s.rk>q.rkk)toast(AX[s.rk],S.pet+' evoluciona','Nuevo rango: '+S.rk[s.rk]);
q.rkk=s.rk;save();r();
}

Object.values(S.p).forEach(p=>dec(p,p===P()));
{const s=chk(1),q=P();q.lv=s.l;q.rkk=s.rk}
