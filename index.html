let h=`<header><button data-a=menu aria-label="Menú">☰</button>${p.pic?`<img class=av src="${p.pic}" alt="">`:''}<div><b>${E(S.cur)}</b><small>${rel()}</small></div></header>
<section class=hero><div class=pw data-a=pet><span class=pet style="font-size:${44+6*s.rk}px;--st:${s.rk+1}">${g>0?'🙈':ST[s.rk]}</span><small class=ax>${AX[s.rk]}</small></div>
<div class=hi><b>${E(S.pet)}</b> · ${E(S.rk[s.rk])}<small>Nivel ${s.l}${s.l>99?' (MAX)':''} · ${s.x} XP</small><div class=bar><i style="width:${s.l>99?100:(s.x-l0)/(l1-l0)*100}%"></i></div></div>
<div class=fire>🔥<b>${s.cur}</b><small>racha</small></div></section><p class=say>${say}</p>
<nav class=dn><button data-a=d data-v=-1 aria-label="Día anterior">‹</button><span>${tit}</span><button data-a=d data-v=1 aria-label="Día siguiente">›</button></nav>
<nav class=tabs>${[['hoy','Hoy'],['elegir','Elegir'],['tareas','Tareas'],['logros','Logros']].map(([a,b])=>`<button data-a=tab data-v=${a} class="${tab==a?'on':''}">${b}</button>`).join('')}</nav><main>`;
if(tab=='hoy'){
h+=`<div class=bar><i style="width:${ts.length?ok/ts.length*100:0}%"></i></div><p class=mu>${ok} de ${ts.length} hechas · cada tarea suma 10 XP</p>`;
h+=ts.length?ts.map(t=>`<div class="row s${dd[t.id]||0}"><button class=box data-a=chk data-v="${t.id}">${['','✓','✗'][dd[t.id]||0]}</button><span>${E(t.t)}</span><small>${E(t.c)}</small></div>`).join(''):`<p class=empty>No has elegido tareas para este día.</p><button class=pri data-a=tab data-v=elegir>Elegir tareas</button>`;
}else if(tab=='elegir'){
h+=`<p class=mu>Toca las tareas que quieres hacer este día.</p><button class=sec data-a=copy>Copiar el plan del día anterior</button>`;
cats(p).forEach(c=>{h+=`<h3>${E(c)}</h3><div class=chips>`+p.tasks.filter(t=>t.c==c).map(t=>`<button class="chip ${pl.includes(t.id)?'on':''}" data-a=sel data-v="${t.id}">${E(t.t)}</button>`).join('')+`</div>`});
}else if(tab=='logros'){
h+=`<p class=mu>${Object.keys(p.ach).length} de ${AD.length} logros</p><div class=ag>${AD.map((a,j)=>`<div class="ac ${p.ach[j]?'':'lk'}"><span>${a.i}</span><b>${E(a.n)}</b><small>${E(a.d)}</small></div>`).join('')}</div>`;
}else{
h+=`<form id=f><input id=nt placeholder="Nueva tarea" required><input id=nc list=cl placeholder="Categoría" required><datalist id=cl>${cats(p).map(c=>`<option value="${E(c)}">`).join('')}</datalist><button class=pri>Añadir tarea</button></form>`;
cats(p).forEach(c=>{h+=`<h3>${E(c)}</h3>`+p.tasks.filter(t=>t.c==c).map(t=>`<div class=row><span>${E(t.t)}</span><button data-a=ed data-v="${t.id}" aria-label="Editar">✎</button><button data-a=del data-v="${t.id}" aria-label="Borrar">🗑</button></div>`).join('')});
}
h+=`</main>`;
if(PU){const ra=RL.filter(v=>PU.a>=v).length-1,rb=RL.filter(v=>PU.b>=v).length-1;h+=`<div class=ov style="z-index:9"></div><div class=pu><b style="font-size:22px">⚠️ ${E(S.pet)} te ha echado de menos</b><p>Llevas ${PU.d} días y ${PU.h} horas sin completar tareas.</p><p>Has perdido ${PU.xp} XP${PU.a>PU.b?` y ${PU.a-PU.b} niveles (de ${PU.a} a ${PU.b})`:''}.</p>${ra>rb?`<p>Has bajado de <b>${E(S.rk[ra])}</b> a <b>${E(S.rk[rb])}</b>.</p>`:''}<button class=pri data-a=ok>Entendido</button></div>`}
if(menu)h+=drawer(p,s,col);if(0)h+=`<div class=ov data-a=close></div><aside><button class=x data-a=close aria-label="Cerrar">✕</button>
<h2>Perfil</h2><div class=g>${Object.keys(S.p).map(n=>`<button class="${n==S.cur?'on':''}" data-a=pf data-v="${E(n)}">${E(n)}</button>`).join('')}</div>
<div class=g style="margin-top:8px"><button data-a=np>Nuevo</button><button data-a=rn>Renombrar</button><button data-a=dp>Eliminar</button></div>
<h2>Ajustes</h2><h3>Tema</h3><div class=g><button class="${S.base=='light'?'on':''}" data-a=ba data-v=light>Claro</button><button class="${S.base=='dark'?'on':''}" data-a=ba data-v=dark>Oscuro</button></div>
<h3>Colores</h3>${HU.map(c=>`<button class="sw ${col&&S.h==c?'on':''}" style="background:hsl(${c} 85% 60%)" data-a=hc data-v="${c}" aria-label="Color"></button>`).join('')}
<h3>Mascota y rangos</h3><div class=g><button data-a=pn>🐒 ${E(S.pet)}</button>${S.rk.map((n,i)=>`<button data-a=rr data-v="${i}">${AX[i]} ${E(n)}</button>`).join('')}</div>
<h3>Compartir rutina</h3><div class=g><button data-a=exp>Copiar mi código</button></div>
<textarea id=imp rows=3 placeholder="Pega aquí un código" style="margin:8px 0"></textarea><button class=pri data-a=imp>Importar</button>
<h3>Datos</h3><button class=sec data-a=rst>Borrar todo</button></aside>`;
$('#app').innerHTML=h;scrollTo(0,y);
}

function drawer(p,s,col){
const pf=p.pic?`<img class=av src="${p.pic}" alt="">`:`<span class=av>${AX[s.rk]}</span>`;
let h=`<div class=ov data-a=close></div><aside><button class=x data-a=close aria-label="Cerrar">✕</button>
<div class=pc>${pf}<div><b>${E(S.cur)}</b><small>${E(S.rk[s.rk])} · Nivel ${s.l}</small><small>${E(p.bio||'Sin descripción')}</small></div></div>`;
if(menu==2)return h+`<h2>Editar perfil</h2><div class=g><button data-a=pic>📷 Cambiar foto</button>${p.pic?'<button data-a=npic>Quitar foto</button>':''}</div><input id=ph type=file accept="image/*" hidden>
<h3>Nombre</h3><input id=pn2 value="${E(S.cur)}" maxlength=24><h3>Descripción</h3><textarea id=bio rows=3 maxlength=140>${E(p.bio||'')}</textarea>
<div class=g style="margin-top:12px"><button class=pri data-a=psv>Guardar</button><button data-a=m1>Volver</button></div>
<h3>Tarjeta</h3><button class=sec data-a=card>Copiar mi tarjeta de perfil</button><p class=mu>Seguir a otras personas necesita un servidor, así que por ahora se comparte la tarjeta.</p></aside>`;
return h+`<div class=g style="margin:10px 0"><button data-a=m2>✏️ Editar perfil</button></div>
<h3>👤 Perfiles</h3><div class=g>${Object.keys(S.p).map(n=>`<button class="${n==S.cur?'on':''}" data-a=pf data-v="${E(n)}">${E(n)}</button>`).join('')}</div>
<div class=g style="margin-top:8px"><button data-a=np>Nuevo</button><button data-a=rn>Renombrar</button><button data-a=dp>Eliminar</button></div>
<h3>🎨 Apariencia</h3><div class=g><button class="${S.base=='light'?'on':''}" data-a=ba data-v=light>Claro</button><button class="${S.base=='dark'?'on':''}" data-a=ba data-v=dark>Oscuro</button></div>
${HU.map(c=>`<button class="sw ${col&&S.h==c?'on':''}" style="background:hsl(${c} 85% 60%)" data-a=hc data-v="${c}" aria-label="Color"></button>`).join('')}
<h3>🐒 Mascota</h3><div class=g><button data-a=pn>${E(S.pet)} ✎</button></div><p class=mu>Rangos: ${S.rk.map((n,i)=>`${AX[i]} ${E(n)}`).join(' → ')}</p>
<h3>📤 Compartir rutina</h3><div class=g><button data-a=exp>Copiar mi código</button></div>
<textarea id=imp rows=3 placeholder="Pega aquí un código" style="margin:8px 0"></textarea><button class=pri data-a=imp>Importar</button>
<h3>⚙️ Datos</h3><button class=sec data-a=rst>Borrar todo</button></aside>`}
function act(a,v){
const p=P(),k=dk(D);
if(a=='pet'){const e=$('.pet');e.classList.remove('bn');void e.offsetWidth;e.classList.add('bn');S.taps=(S.taps||0)+1;chk();save();return}
if(a=='ok')PU=null;
else if(a=='menu')menu=1;
else if(a=='close')menu=0;
else if(a=='d')D.setDate(D.getDate()+ +v);
else if(a=='tab')tab=v;
else if(a=='chk'){const d=p.done[k]=p.done[k]||{};const n=((d[v]||0)+1)%3;n?d[v]=n:delete d[v];if(n==1)p.act=Date.now()}
else if(a=='sel'){const l=p.plan[k]=p.plan[k]||[];const i=l.indexOf(v);i<0?l.push(v):l.splice(i,1)}
else if(a=='copy'){const o=new Date(D);o.setDate(o.getDate()-1);p.plan[k]=[...(p.plan[dk(o)]||[])]}
else if(a=='ed'){const t=p.tasks.find(x=>x.id==v),n=prompt('Editar tarea',t.t);if(n&&n.trim())t.t=n.trim();const c=prompt('Categoría',t.c);if(c&&c.trim())t.c=c.trim()}
else if(a=='del'){if(confirm('¿Borrar esta tarea?'))p.tasks=p.tasks.filter(x=>x.id!=v)}
else if(a=='ba')S.base=v;
else if(a=='hc'){S.base='color';S.h=+v}
else if(a=='pn'){const n=(prompt('Nombre de tu mascota',S.pet)||'').trim();if(n)S.pet=n}
else if(a=='rr'){const n=(prompt('Nombre del rango',S.rk[v])||'').trim();if(n)S.rk[v]=n}
else if(a=='pf')S.cur=v;
else if(a=='m1')menu=1;
else if(a=='m2')menu=2;
else if(a=='pic'){$('#ph').click();return}
else if(a=='npic')delete p.pic;
else if(a=='psv'){const n=($('#pn2').value||'').trim();p.bio=$('#bio').value.trim();if(n&&n!=S.cur&&!S.p[n]){S.p[n]=S.p[S.cur];delete S.p[S.cur];S.cur=n}menu=1}
else if(a=='card'){const s=fs(p),c=`${S.cur} · ${S.rk[s.rk]} · Nivel ${s.l} · 🔥 ${s.cur} · 🏆 ${s.ac}/${AD.length} logros`;navigator.clipboard?navigator.clipboard.writeText(c).then(()=>alert('Tarjeta copiada')):prompt('Copia tu tarjeta',c)}
else if(a=='np'){const n=(prompt('Nombre del perfil')||'').trim();if(n&&!S.p[n]){S.p[n]=mk();S.cur=n}}
else if(a=='rn'){const n=(prompt('Nuevo nombre',S.cur)||'').trim();if(n&&!S.p[n]){S.p[n]=S.p[S.cur];delete S.p[S.cur];S.cur=n}}
else if(a=='dp'){if(Object.keys(S.p).length<2)alert('Necesitas al menos un perfil.');else if(confirm('¿Eliminar el perfil '+S.cur+'?')){delete S.p[S.cur];S.cur=Object.keys(S.p)[0]}}
else if(a=='exp'){S.ex=1;const c=btoa(unescape(encodeURIComponent(JSON.stringify({n:S.cur,t:p.tasks.map(t=>[t.c,t.t])}))));
if(navigator.clipboard)navigator.clipboard.writeText(c).then(()=>alert('Código copiado'),()=>prompt('Copia tu código',c));else prompt('Copia tu código',c)}
else if(a=='imp'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));let n=o.n,i=2;while(S.p[n])n=o.n+' '+i++;const q=mk();q.tasks=o.t.map((x,j)=>({id:'i'+j,t:String(x[1]),c:String(x[0])}));S.p[n]=q;S.cur=n;S.ex=1;alert('Perfil importado: '+n)}catch(e){alert('Ese código no es válido.')}}
else if(a=='rst'){if(confirm('¿Borrar todos tus datos?')){try{localStorage.removeItem(K)}catch(e){}location.reload();return}}
const q=P();dec(q);const s=chk();
if(s.l>q.lv)toast('⬆️','¡Nivel '+s.l+'!','Ahora eres '+S.rk[s.rk]);
q.lv=s.l;
if(s.rk>q.rkk)toast(AX[s.rk],S.pet+' evoluciona','Nuevo rango: '+S.rk[s.rk]);
q.rkk=s.rk;save();r();
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.addEventListener('submit',e=>{e.preventDefault();const t=$('#nt').value.trim(),c=$('#nc').value.trim();if(t&&c){P().tasks.push({id:'u'+Date.now(),t,c});const q=P(),s=chk();q.lv=s.l;q.rkk=s.rk;save();r()}});
document.addEventListener('change',e=>{if(e.target.id!='ph'||!e.target.files[0])return;const f=new FileReader();f.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);P().pic=c.toDataURL('image/jpeg',.75);chk();save();r()};im.src=f.result};f.readAsDataURL(e.target.files[0])});
Object.values(S.p).forEach(p=>dec(p,p===P()));
{const s=chk(1),q=P();q.lv=s.l;q.rkk=s.rk}
save();r();
</script>
</body>
</html>
